name: Snapshot official sources

# Saves a text copy of every official page the ship references cite into sources/
# on the snapshots branch (main only takes pull requests),
# so sessions whose network blocks a store's help site can still read the rule.
# A changed or failed page opens an issue naming the reference files that cite it,
# so the claims built on it get re-checked (the fact-check skill).

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: snapshot-sources
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check out the snapshots branch
        run: |
          if git fetch -q origin snapshots; then
            git worktree add -B snapshots out origin/snapshots
          else
            git worktree add --orphan -b snapshots out
          fi
      - run: SNAPSHOT_DIR=out/sources node scripts/snapshot-sources.mjs | tee snapshot-report.txt
      - name: Commit to the snapshots branch if anything changed
        working-directory: out
        run: |
          git add sources
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          { echo "Snapshot official sources $(date -u +%F)"; echo; grep -E '^(NEW|CHANGED|FAILED)' ../snapshot-report.txt || true; } > ../msg.txt
          git commit -q -F ../msg.txt
          git push origin snapshots
      - name: Open an issue to re-check what changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -E '^(CHANGED|FAILED)' snapshot-report.txt > changed.txt || exit 0
          {
            echo "The weekly snapshot found official pages that changed or could not be saved."
            echo "Run the fact-check skill on the reference files named below, against the saved copies on the snapshots branch."
            echo
            sed 's/^/- /' changed.txt
          } > body.md
          gh issue create --title "Re-check facts: official pages changed $(date -u +%F)" --body-file body.md
